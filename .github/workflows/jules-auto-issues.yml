name: Jules Automated Code Scanner, PR Governance & 24h Auto-Merge

on:
  push:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  schedule:
    # Runs every hour to enforce the 24-hour PR auto-merge timer and scan for new tasks
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      max_new_issues:
        description: "Maximum number of new Jules issues to open in this run"
        required: false
        default: "10"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  scan-and-govern:
    name: Codebase Scan, Final Owner Check & 24h Auto-Merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run Auto-Triage & 24h PR Governance
        env:
          GITHUB_TOKEN: ${{ secrets.JULES_TRIGGER_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAX_NEW_ISSUES: ${{ github.event.inputs.max_new_issues || '10' }}
        run: node src/auto-triage.ts
